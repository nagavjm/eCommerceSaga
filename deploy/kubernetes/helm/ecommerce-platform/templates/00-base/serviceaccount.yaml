apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ecommerce.fullname" . }}-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.azureWorkloadIdentityClientId | default "00000000-0000-0000-0000-000000000000" | quote }}
