apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: order-api
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.order.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: order-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-api
        app.kubernetes.io/part-of: ecommerce-platform
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: order-api
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.order.image.repository }}:{{ .Values.order.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: DB_SERVER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-config
                  key: DB_SERVER
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-config
                  key: DB_USER
            - name: DB_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ecommerce.fullname" . }}-config
                  key: DB_OPTIONS
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            - name: ConnectionStrings__OrderDb
              value: "Server=$(DB_SERVER),$(DB_PORT);Database=ECommerceOrderDb;User Id=$(DB_USER);Password=$(DB_PASSWORD);$(DB_OPTIONS)"
            - name: AzureServiceBus__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serviceBus.secretName }}
                  key: {{ .Values.serviceBus.secretKey }}
          resources:
            {{- toYaml .Values.order.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: order-api
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: order-api
