# Production overlay values for Azure Kubernetes Service (AKS)
global:
  namespace: ecommerce-prod
  environment: Production
  imageRegistry: ecommerceregistry.azurecr.io
  imagePullPolicy: Always
  imagePullSecrets:
    - name: acr-prod-secret

embeddedDevInfra:
  enabled: false

database:
  server: "ecommerce-prod-sql.database.windows.net"
  port: 1433
  user: "ecom_db_admin"
  secretName: "aks-keyvault-secrets"
  secretKey: "sql-admin-password"
  options: "Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;MultipleActiveResultSets=true;"

serviceBus:
  connectionString: ""
  secretName: "aks-keyvault-secrets"
  secretKey: "servicebus-connection-string"

redis:
  connectionString: "ecommerce-prod-redis.redis.cache.windows.net:6380,ssl=True,abortConnect=False"
  secretName: "aks-keyvault-secrets"
  secretKey: "redis-primary-key"

jwt:
  issuer: "https://auth.ecommerce.enterprise.com"
  audience: "ECommercePlatform"
  secretName: "aks-keyvault-secrets"
  secretKey: "jwt-secret-key"

identity:
  replicaCount: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPU: 70
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

product:
  replicaCount: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPU: 65
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

cart:
  replicaCount: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPU: 70
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

inventory:
  replicaCount: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPU: 65
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1200m, memory: 1.5Gi }

order:
  replicaCount: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPU: 65
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1200m, memory: 1.5Gi }

payment:
  replicaCount: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPU: 70
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

shipping:
  replicaCount: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 75
  resources:
    requests: { cpu: 150m, memory: 384Mi }
    limits: { cpu: 800m, memory: 768Mi }

notification:
  replicaCount: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 75
  resources:
    requests: { cpu: 150m, memory: 384Mi }
    limits: { cpu: 800m, memory: 768Mi }

sagaOrchestrator:
  replicaCount: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPU: 65
  resources:
    requests: { cpu: 300m, memory: 512Mi }
    limits: { cpu: 1500m, memory: 1.5Gi }

gateway:
  replicaCount: 4
  hpa:
    enabled: true
    minReplicas: 4
    maxReplicas: 20
    targetCPU: 60
  resources:
    requests: { cpu: 500m, memory: 768Mi }
    limits: { cpu: 2000m, memory: 2Gi }

frontend:
  replicaCount: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPU: 75
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 400m, memory: 512Mi }

ingress:
  enabled: true
  className: "azure-application-gateway"
  annotations:
    kubernetes.io/ingress.class: "azure/application-gateway"
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: ecommerce.enterprise.com
      paths:
        - path: /api/*
          pathType: ImplementationSpecific
          service: gateway
          port: 8080
        - path: /*
          pathType: ImplementationSpecific
          service: frontend
          port: 80
  tls:
    - secretName: ecommerce-tls-cert-prod
      hosts:
        - ecommerce.enterprise.com

podDisruptionBudget:
  enabled: true
  minAvailable: 2
