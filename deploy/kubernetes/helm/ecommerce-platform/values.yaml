# Default values for ecommerce-platform Helm Chart
global:
  namespace: ecommerce
  environment: Production
  imageRegistry: myregistry.azurecr.io
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: acr-secret

# -------------------------------------------------------------
# Shared Infrastructure Configurations
# -------------------------------------------------------------
database:
  server: "sqlserver.database.windows.net"
  port: 1433
  user: "sqladmin"
  secretName: "ecommerce-secrets"
  secretKey: "sql-password"
  options: "TrustServerCertificate=True;MultipleActiveResultSets=true;"

serviceBus:
  connectionString: ""
  secretName: "ecommerce-secrets"
  secretKey: "servicebus-connection-string"

redis:
  connectionString: "ecommerce-redis.redis.cache.windows.net:6380,ssl=True,abortConnect=False"
  secretName: "ecommerce-secrets"
  secretKey: "redis-connection-string"

jwt:
  issuer: "ECommercePlatform.IdentityService"
  audience: "ECommercePlatform"
  secretName: "ecommerce-secrets"
  secretKey: "jwt-secret"

# Embedded dev infrastructure (disabled in prod values)
embeddedDevInfra:
  enabled: false

# -------------------------------------------------------------
# Microservices Defaults
# -------------------------------------------------------------
identity:
  replicaCount: 2
  image:
    repository: ecommerce/identity-api
    tag: 1.0.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 75

