# -------------------------------------------------------------
# Ingress Configuration (NGINX / AGIC)
# -------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: ecommerce.enterprise.com
      paths:
        - path: /api/
          pathType: Prefix
          service: gateway
          port: 8080
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
  tls:
    - secretName: ecommerce-tls-cert
      hosts:
        - ecommerce.enterprise.com

# -------------------------------------------------------------
# Pod Disruption Budget
# -------------------------------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 1
